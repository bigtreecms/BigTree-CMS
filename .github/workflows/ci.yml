name: CI

on:
  push:
    branches: [master, remaster]
  pull_request:

jobs:
  spa:
    name: SPA (typecheck / lint / test / build / storybook)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Matches spa/.nvmrc (Node 24). All SPA toolchain deps (Vite 5,
          # Vitest 3, ESLint 9, Storybook 10) declare engines that accept 24.
          node-version-file: spa/.nvmrc
          cache: npm
          cache-dependency-path: spa/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # eslint runs with --max-warnings 0 and includes prettier; the tree is clean
      # at HEAD and this step gates any new lint/format drift.
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Ship path: spa/dist (scratch) → core/admin/dist (committed). --check fails
      # when packaging was forgotten after SPA source changes.
      - name: Package SPA and assert core/admin/dist is up to date
        working-directory: .
        run: |
          bash scripts/package-admin-spa.sh --check
          if find core/admin/dist -name '*.map' -type f | grep -q .; then
            echo "error: source maps must not exist under core/admin/dist" >&2
            exit 1
          fi
      - name: Upload packaged admin SPA (debug artifact)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: admin-spa-dist
          path: core/admin/dist
          if-no-files-found: error
          retention-days: 7
      # Storybook: the static build catches a broken story config, and
      # test-storybook smoke-renders every story in a real headless Chromium via
      # the Vitest browser project — so install just that browser (+ its OS deps)
      # first. Only chromium is needed (vitest.config pins it).
      - run: npm run build-storybook
      - run: npx playwright install --with-deps chromium
      - run: npm run test-storybook

  php:
    name: PHP (lint + API tests)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: bigtree_test
        ports:
          - 3306:3306
        # Wait for MySQL to accept connections before any step runs.
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mysqli, gd, json
          # PHPStan + php-cs-fixer installed as CI tools (NOT via composer — this
          # repo commits vendor/ and must not bloat it). Scoped to the new API +
          # services surface; see phpstan.neon.dist / .php-cs-fixer.dist.php.
          tools: phpstan, php-cs-fixer
      # Tree-wide syntax lint: php -l every PHP file under core/ (not just the new
      # api+services surface). Legacy files still receive bug-fixes and were
      # previously unchecked in CI; this catches the most embarrassing class of
      # regression (a fat-fingered parse error) across the whole tree. Non-breaking
      # (only genuine syntax errors fail) and DB-free, so it runs ahead of the
      # static-analysis and schema steps. PHPStan + php-cs-fixer below stay scoped
      # to api+services intentionally.
      - name: Lint all PHP (core/)
        run: |
          find core -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l
      # Static analysis + style run against api+services only and need no DB, so
      # they sit ahead of the schema load. Both are green-on-day-one (PHPStan via
      # a committed baseline; style via a pared-back hygiene rule set).
      - name: PHP static analysis (api + services)
        run: phpstan analyse --no-progress
      - name: PHP code style check (api + services)
        run: php-cs-fixer fix --dry-run --diff
      # composer audit reads the committed composer.lock and fails on known
      # advisories (needs no DB, just network to the advisory DB), so it sits
      # with the other static checks ahead of the schema load.
      - name: Composer audit (fail on known advisories)
        run: composer audit --no-dev
      # base.sql is the canonical installer schema. FOREIGN KEY constraints are
      # added as trailing ALTER TABLE statements after all tables exist, so it
      # imports cleanly with FK checks enabled (no FOREIGN_KEY_CHECKS=0 needed).
      - name: Load schema
        run: mysql -h 127.0.0.1 -P 3306 -uroot -proot bigtree_test < core/setup/base.sql
      # A checkout is not a site: /custom, /templates, /site, /cache and
      # /extensions are all gitignored, and core/setup/install.php is what creates
      # them, seeds custom/json-db/ from core/setup/json-db/ and renders
      # custom/settings.php from core/setup/settings.php. scripts/ci-install.sh
      # mirrors that, which is why it replaced the inline subset this step used to
      # write — the subset had no seeded templates (every create-page fixture
      # failed), no settings_key (cms.php warns on every getSetting()) and no
      # templates/callouts/ (create_callout refuses on an unwritable directory).
      - name: Install CI site (mirrors core/setup/install.php)
        run: scripts/ci-install.sh http://localhost/ bigtree_test 3306
      # The test runner SILENTLY SKIPS DB-backed assertions if PHP can't reach
      # the database (measured: 128 pass with no DB vs 141 with the schema, and
      # Failed stays 0 either way). A pass-count floor can't reliably tell those
      # apart, so gate DB connectivity explicitly here — fail loud before the suite.
      - name: Verify DB connectivity
        run: |
          php -r 'mysqli_report(MYSQLI_REPORT_OFF); $bigtree=["config"=>[]]; include "custom/environment.php"; $d=$bigtree["config"]["db"]; $m=@new mysqli($d["host"],$d["user"],$d["password"],$d["name"],$d["port"]?:3306); if($m->connect_errno){fwrite(STDERR,"DB connect failed: ".$m->connect_error."\n");exit(1);} if($m->query("SELECT 1 FROM bigtree_users LIMIT 1")===false){fwrite(STDERR,"schema missing (bigtree_users)\n");exit(1);} echo "DB OK\n";'
      # DB-down detection is handled by the "Verify DB connectivity" pre-flight
      # above. The pass-count check here is only a "runner executed" sanity check
      # (it confirms run.php produced a summary at all); the Failed: 0 assertion
      # still gates real test failures.
      - name: Run API test suite
        run: |
          OUTPUT=$(php core/inc/bigtree/api/_test/run.php)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -qE 'Passed: [1-9][0-9]+ ' \
            || { echo "Test runner produced no summary"; exit 1; }
          echo "$OUTPUT" | grep -q 'Failed: 0' \
            || { echo "One or more API tests failed"; exit 1; }
          # run.php prints an UNCAUGHT exception as "  ! message" and does NOT count
          # it as a failure — a test that dies before its first assertion looks like
          # a pass in the summary. Gate on it explicitly.
          echo "$OUTPUT" | grep -q '^  ! ' \
            && { echo "A test threw an uncaught exception (see '!' lines above)"; exit 1; }
          exit 0

  migrated:
    name: PHP (upgraded install — migrate from pre-512 utf8mb3)
    # The php job above builds from base.sql, i.e. only ever tests a FRESH install.
    # This one starts from the frozen pre-512 schema (every core table utf8mb3, every
    # varchar(1024) indexed in full), runs the real migration runner, and then runs the
    # same suite — so the two paths are proven to converge rather than assumed to
    # (plans/utf8mb4-migration.md, V3). Utf8mb4SchemaTest is what asserts the end
    # state; it skips on an unconverted database, which is why running it HERE matters.
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: bigtree_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mysqli, gd, json
      # The service container creates bigtree_test at the server default, which is
      # utf8mb4 on MySQL 8 — so without this the ALTER DATABASE in revision 512 is
      # never exercised. A pre-512 install's schema default is utf8mb3 (or latin1).
      - name: Make the starting database utf8mb3, like a pre-512 install
        run: mysql -h 127.0.0.1 -P 3306 -uroot -proot -e "ALTER DATABASE bigtree_test CHARACTER SET utf8mb3 COLLATE utf8mb3_general_ci"
      - name: Load the frozen pre-512 (utf8mb3) schema
        run: mysql -h 127.0.0.1 -P 3306 -uroot -proot bigtree_test < core/inc/bigtree/api/_test/fixtures/base-utf8mb3-pre512.sql
      # A stand-in for a site's own module table, because M1 sweeps everything in the
      # schema and not just core: one varchar(1024) indexed in full (512 has to narrow
      # it) and one FULLTEXT index (512 has to leave it alone). A FULLTEXT index
      # reports no Sub_part on a `text` column, so costing its parts the way a BTREE
      # part is costed reads as 65535 * 4 bytes, and the "fix" — DROP INDEX, ADD INDEX
      # (body(191)) — is one MySQL accepts without a word while breaking every
      # MATCH ... AGAINST on the table.
      - name: Plant a site table with a FULLTEXT index
        run: |
          mysql -h 127.0.0.1 -P 3306 -uroot -proot bigtree_test -e "
            CREATE TABLE \`zz_site_articles\` (
              \`id\` INT(11) UNSIGNED NOT NULL AUTO_INCREMENT,
              \`headline\` VARCHAR(1024) NOT NULL DEFAULT '',
              \`body\` TEXT NOT NULL,
              PRIMARY KEY (\`id\`),
              KEY \`headline\` (\`headline\`),
              FULLTEXT KEY \`ft_body\` (\`body\`)
            ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb3 COLLATE=utf8mb3_general_ci;
            INSERT INTO \`zz_site_articles\` (\`headline\`, \`body\`) VALUES ('Timber', 'a lumberjack story');"
      - name: Install CI site (mirrors core/setup/install.php)
        run: scripts/ci-install.sh http://localhost/ bigtree_test 3306
      # Guard the guard: if the fixture ever stopped being utf8mb3, this job would
      # silently become a duplicate of the php job.
      # NOT LIKE 'utf8mb4%' rather than LIKE 'utf8mb3%': MySQL renamed the collation
      # from utf8_general_ci to utf8mb3_general_ci mid-8.0, and 5.7 only knows the
      # former.
      - name: Assert the starting schema really is not utf8mb4
        run: |
          COUNT=$(mysql -h 127.0.0.1 -P 3306 -uroot -proot -N -e \
            "SELECT COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA='bigtree_test' AND TABLE_COLLATION NOT LIKE 'utf8mb4%'")
          echo "non-utf8mb4 tables before migrating: $COUNT"
          test "$COUNT" -gt 0 || { echo "fixture is not a pre-512 schema"; exit 1; }
      - name: Apply pending revisions (508 … 512)
        run: php core/admin/migrate-run.php
      - name: Assert nothing is left non-utf8mb4
        run: |
          LEFT=$(mysql -h 127.0.0.1 -P 3306 -uroot -proot -N -e \
            "SELECT COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA='bigtree_test' AND TABLE_COLLATION NOT LIKE 'utf8mb4%'")
          COLS=$(mysql -h 127.0.0.1 -P 3306 -uroot -proot -N -e \
            "SELECT COUNT(*) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA='bigtree_test' AND CHARACTER_SET_NAME IS NOT NULL AND CHARACTER_SET_NAME <> 'utf8mb4'")
          echo "non-utf8mb4 tables: $LEFT, non-utf8mb4 string columns: $COLS"
          test "$LEFT" = "0" || { echo "revision 512 left a non-utf8mb4 table"; exit 1; }
          test "$COLS" = "0" || { echo "revision 512 left a non-utf8mb4 column"; exit 1; }
      # The container, not just the contents: the schema default is what every later
      # CREATE TABLE that names no charset inherits.
      - name: Assert the database's own default converted
        run: |
          DEFAULT=$(mysql -h 127.0.0.1 -P 3306 -uroot -proot -N -e \
            "SELECT DEFAULT_CHARACTER_SET_NAME FROM information_schema.SCHEMATA WHERE SCHEMA_NAME='bigtree_test'")
          echo "database default charset: $DEFAULT"
          test "$DEFAULT" = "utf8mb4" || { echo "revision 512 left the database default at $DEFAULT"; exit 1; }
      # The planted site table: the wide indexed varchar narrows, the FULLTEXT index
      # is untouched. A FULLTEXT that came back as BTREE means the index-cost sweep
      # started treating non-BTREE indexes as over-limit again.
      - name: Assert the FULLTEXT index survived and the wide index narrowed
        run: |
          FT=$(mysql -h 127.0.0.1 -P 3306 -uroot -proot -N -e \
            "SELECT INDEX_TYPE FROM information_schema.STATISTICS WHERE TABLE_SCHEMA='bigtree_test' AND TABLE_NAME='zz_site_articles' AND INDEX_NAME='ft_body'")
          WIDTH=$(mysql -h 127.0.0.1 -P 3306 -uroot -proot -N -e \
            "SELECT CHARACTER_MAXIMUM_LENGTH FROM information_schema.COLUMNS WHERE TABLE_SCHEMA='bigtree_test' AND TABLE_NAME='zz_site_articles' AND COLUMN_NAME='headline'")
          echo "ft_body index type: $FT, headline width: $WIDTH"
          test "$FT" = "FULLTEXT" || { echo "revision 512 downgraded a FULLTEXT index to '$FT'"; exit 1; }
          test "$WIDTH" = "191" || { echo "revision 512 did not narrow the indexed varchar(1024) (got '$WIDTH')"; exit 1; }
          mysql -h 127.0.0.1 -P 3306 -uroot -proot bigtree_test -N -e \
            "SELECT COUNT(*) FROM zz_site_articles WHERE MATCH(body) AGAINST('lumberjack')" \
            || { echo "MATCH ... AGAINST no longer works on the migrated table"; exit 1; }
      # Re-running has to be a no-op: every step in 512 is guarded by its own state
      # check, which is what makes a run interrupted on a large table resumable.
      - name: Re-run the migration runner (idempotency)
        run: php core/admin/migrate-run.php
      - name: Run API test suite against the migrated database
        run: |
          OUTPUT=$(php core/inc/bigtree/api/_test/run.php)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -qE 'Passed: [1-9][0-9]+ ' \
            || { echo "Test runner produced no summary"; exit 1; }
          echo "$OUTPUT" | grep -q 'Failed: 0' \
            || { echo "One or more API tests failed"; exit 1; }
          echo "$OUTPUT" | grep -q '^  ! ' \
            && { echo "A test threw an uncaught exception (see '!' lines above)"; exit 1; }
          exit 0

  smoke:
    name: API smoke tests (P0 matrix)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: bigtree_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mysqli, gd, json
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Load schema
        run: mysql -h 127.0.0.1 -P 3306 -uroot -proot bigtree_test < core/setup/base.sql
      # Unlike the API test runner (which never boots the HTTP layer), the smoke
      # server runs the real front controller, so the roots have to point at the
      # local php -S server. Everything else — the installer's directory list,
      # the json-db seed, settings_key and api.jwt_secret — comes from the shared
      # installer, same as the php job.
      - name: Install CI site (mirrors core/setup/install.php)
        env:
          BIGTREE_CI_SETTINGS_KEY: ci-smoke-settings-key-aaaaaaaaaaaaaaaa
          BIGTREE_CI_JWT_SECRET: ci-smoke-jwt-secret-at-least-32-bytes-long
        run: scripts/ci-install.sh http://127.0.0.1:8080/ bigtree_test 3306
      # Seed a level-2 (developer) admin whose password hash comes from the same
      # password_hash(PASSWORD_DEFAULT) AuthService::verifyPassword checks when
      # new_hash = 'on'. All NOT-NULL columns are set.
      - name: Seed smoke-test admin user
        env:
          BIGTREE_TEST_EMAIL: smoke@ci.local
          BIGTREE_TEST_PASSWORD: SmokeTest-CI-2026!
        run: |
          HASH=$(php -r 'echo password_hash(getenv("BIGTREE_TEST_PASSWORD"), PASSWORD_DEFAULT);')
          mysql -h 127.0.0.1 -P 3306 -uroot -proot bigtree_test \
            -e "INSERT INTO bigtree_users (email,password,new_hash,\`2fa_secret\`,\`2fa_login_token\`,name,company,level,permissions,alerts,daily_digest,timezone,change_password_hash,token_version) VALUES ('${BIGTREE_TEST_EMAIL}','${HASH}','on','','','Smoke CI','',2,'{}','','','UTC','',1) ON DUPLICATE KEY UPDATE password=VALUES(password), new_hash='on', level=2, token_version=1;"
      # Boot the app under php's built-in server via ci-router.php (emulates the
      # .htaccess rewrite), then poll /auth/login-policy until it answers 200.
      - name: Start PHP server
        run: |
          REPO_ROOT="$(pwd)/" php -S 127.0.0.1:8080 \
            core/inc/bigtree/api/_smoke/ci-router.php > /tmp/php-smoke.log 2>&1 &
          for i in $(seq 1 20); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/admin/api/v1/auth/login-policy)" = "200" ]; then
              echo "Server ready after ${i}s"
              break
            fi
            if [ "$i" -eq 20 ]; then
              echo "Server did not become ready; log:"
              cat /tmp/php-smoke.log
              exit 1
            fi
            sleep 1
          done
      # Phase 2: full P0 HTTP matrix (auth + tags + pages + users + settings +
      # scaffolded modules + templates + resources + page-sites). Fail-fast so the
      # first red domain is obvious in the log; run-all also continues when
      # BIGTREE_SMOKE_FAIL_FAST=0 for local debugging.
      - name: Run P0 API smoke matrix
        env:
          BIGTREE_API_BASE: http://127.0.0.1:8080/admin/api/v1
          BIGTREE_TEST_EMAIL: smoke@ci.local
          BIGTREE_TEST_PASSWORD: SmokeTest-CI-2026!
          BIGTREE_SMOKE_FAIL_FAST: "1"
        run: bash core/inc/bigtree/api/_smoke/run-all.sh
      # SPA cutover: admin HTML is served from core/admin/dist (committed).
      - name: Smoke SPA index + asset rewrite + classic redirect
        run: |
          set -euo pipefail
          BODY=$(curl -sS -D /tmp/admin-headers.txt http://127.0.0.1:8080/admin/)
          echo "$BODY" | grep -q '__BIGTREE_ADMIN__' \
            || { echo "missing boot config injection"; exit 1; }
          echo "$BODY" | grep -q '__BIGTREE_ADMIN_BASE__' \
            && { echo "unreplaced Vite base placeholder in HTML"; exit 1; }
          echo "$BODY" | grep -qE 'src="/admin/assets/[^"]+\.js"' \
            || { echo "expected rewritten /admin/assets/*.js script tag"; exit 1; }
          ASSET=$(echo "$BODY" | sed -n 's/.*src="\(\/admin\/assets\/[^"]*\.js\)".*/\1/p' | head -1)
          test -n "$ASSET"
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:8080${ASSET}")
          test "$CODE" = "200" || { echo "asset $ASSET returned $CODE"; exit 1; }
          REDIR=$(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' \
            http://127.0.0.1:8080/admin/pages/edit/1/)
          echo "$REDIR" | grep -qE '^302 ' \
            || { echo "expected 302 for classic pages/edit; got $REDIR"; exit 1; }
          echo "$REDIR" | grep -q '/admin/pages/1/edit' \
            || { echo "expected Location …/pages/1/edit; got $REDIR"; exit 1; }
          echo "SPA smoke OK"
      - name: Dump PHP server log on failure
        if: failure()
        run: cat /tmp/php-smoke.log || true

  e2e:
    name: SPA Playwright E2E (critical journeys)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: bigtree_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mysqli, gd, json
      - uses: actions/setup-node@v4
        with:
          node-version-file: spa/.nvmrc
          cache: npm
          cache-dependency-path: spa/package-lock.json
      - name: Load schema
        run: mysql -h 127.0.0.1 -P 3306 -uroot -proot bigtree_test < core/setup/base.sql
      - name: Install CI site (mirrors core/setup/install.php)
        env:
          BIGTREE_CI_SETTINGS_KEY: ci-smoke-settings-key-aaaaaaaaaaaaaaaa
          BIGTREE_CI_JWT_SECRET: ci-smoke-jwt-secret-at-least-32-bytes-long
        run: scripts/ci-install.sh http://127.0.0.1:8080/ bigtree_test 3306
      - name: Seed e2e admin user
        env:
          E2E_EMAIL: smoke@ci.local
          E2E_PASSWORD: SmokeTest-CI-2026!
        run: |
          HASH=$(php -r 'echo password_hash(getenv("E2E_PASSWORD"), PASSWORD_DEFAULT);')
          mysql -h 127.0.0.1 -P 3306 -uroot -proot bigtree_test \
            -e "INSERT INTO bigtree_users (email,password,new_hash,\`2fa_secret\`,\`2fa_login_token\`,name,company,level,permissions,alerts,daily_digest,timezone,change_password_hash,token_version) VALUES ('${E2E_EMAIL}','${HASH}','on','','','E2E CI','',2,'{}','','','UTC','',1) ON DUPLICATE KEY UPDATE password=VALUES(password), new_hash='on', level=2, token_version=1;"
          # Homepage row so pages tree / permissions have a parent to attach to
          mysql -h 127.0.0.1 -P 3306 -uroot -proot bigtree_test -e \
            "INSERT IGNORE INTO bigtree_pages (id,trunk,parent,in_nav,nav_title,route,path,title,meta_keywords,meta_description,seo_invisible,template,external,new_window,resources,archived,archived_inherited,max_age,last_edited_by,ga_page_views,position,created_at,updated_at) VALUES (0,'',-1,'on','Home','','','Home','','','','content','','','{}','','',0,1,0,0,NOW(),NOW()), (1,'',0,'on','About','about','about','About','','','','content','','','{}','','',0,1,0,0,NOW(),NOW());" \
            || true
          # Mark the schema as fully migrated. The e2e user is a level-2 developer,
          # and ProtectedRoute forces developers to /developer/migrations whenever
          # the live migration queue is non-empty. A fresh test DB has no
          # bigtree-internal-revision setting (treated as revision 0), so without
          # this every revision script would be "pending" and login #1 would land
          # on the migration gate instead of the dashboard. Setting it to the
          # current BIGTREE_REVISION empties the queue. The value is stored as the
          # JSON encoding of the integer (a bare number), matching SettingService.
          REV=$(php -r 'include "core/version.php"; echo (int)BIGTREE_REVISION;')
          mysql -h 127.0.0.1 -P 3306 -uroot -proot bigtree_test -e \
            "INSERT INTO bigtree_settings (id,value,encrypted) VALUES ('bigtree-internal-revision','${REV}','') ON DUPLICATE KEY UPDATE value=VALUES(value), encrypted='';"
      - name: Start PHP server
        run: |
          REPO_ROOT="$(pwd)/" php -S 127.0.0.1:8080 \
            core/inc/bigtree/api/_smoke/ci-router.php > /tmp/php-e2e.log 2>&1 &
          for i in $(seq 1 30); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/admin/api/v1/auth/login-policy)" = "200" ]; then
              echo "Server ready after ${i}s"
              break
            fi
            if [ "$i" -eq 30 ]; then
              cat /tmp/php-e2e.log
              exit 1
            fi
            sleep 1
          done
      - name: Install SPA deps + Playwright Chromium
        working-directory: spa
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run Playwright critical journeys
        working-directory: spa
        env:
          E2E_BASE_URL: http://127.0.0.1:8080/admin
          E2E_API_BASE: http://127.0.0.1:8080/admin/api/v1
          E2E_EMAIL: smoke@ci.local
          E2E_PASSWORD: SmokeTest-CI-2026!
          CI: "true"
        run: npm run test:e2e
      - name: Dump PHP log on failure
        if: failure()
        run: cat /tmp/php-e2e.log || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            spa/test-results
            spa/playwright-report
