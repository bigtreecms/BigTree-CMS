<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Geist font family — matches design tokens -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <title>BigTree Admin</title>

    <!-- SDK import map: lets custom action modules (and the live preview) resolve
         bare `react` / `@bigtree/ui` / `@bigtree/fields` imports to the SPA's own
         singletons. Inert for app code (Vite resolves those at build time); only
         the blob-imported author modules consume it. See src/sdk/registerSdk.ts. -->
    <script type="importmap">
      {
        "imports": {
          "react": "/sdk/react.js",
          "react/jsx-runtime": "/sdk/react-jsx-runtime.js",
          "@bigtree/ui": "/sdk/ui.js",
          "@bigtree/fields": "/sdk/fields.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
